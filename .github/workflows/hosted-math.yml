name: Hosted mathematics

on:
  push:
    branches:
      - 'furnish/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install browser and math dependencies
        shell: bash
        run: |
          npm install --prefix "${RUNNER_TEMP}/gibbs-hosted-deps" playwright@1.56.1 mathjax-full@3.2.1
          "${RUNNER_TEMP}/gibbs-hosted-deps/node_modules/.bin/playwright" install --with-deps chromium
      - name: Capture actual GitHub rendering
        shell: bash
        run: |
          export NODE_PATH="${RUNNER_TEMP}/gibbs-hosted-deps/node_modules"
          node verification/hosted_math/capture_hosted_math.cjs \
            --root "${GITHUB_WORKSPACE}" \
            --repository "${GITHUB_REPOSITORY}" \
            --revision "${GITHUB_SHA}" \
            --output "${RUNNER_TEMP}/gibbs-hosted-evidence"
      - name: Preserve capture and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-math-${{ github.sha }}
          path: ${{ runner.temp }}/gibbs-hosted-evidence
          if-no-files-found: error
          retention-days: 7

