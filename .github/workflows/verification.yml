name: Scientific and hosted verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install numerical and rendering dependencies
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0
          npm install --prefix "$RUNNER_TEMP/math-deps" playwright@1.56.1 mathjax-full@3.2.1
          "$RUNNER_TEMP/math-deps/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check finite identities
        run: python verification/validate.py --output "$RUNNER_TEMP/scientific-results.json"
      - name: Compare every hosted formula at wide and narrow widths
        env:
          NODE_PATH: ${{ runner.temp }}/math-deps/node_modules
        run: |
          node verification/hosted/capture_hosted_math.cjs --root "$GITHUB_WORKSPACE" --repository "$GITHUB_REPOSITORY" --revision "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/hosted"
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/scientific-results.json
            ${{ runner.temp }}/hosted/
          if-no-files-found: error
          retention-days: 30
